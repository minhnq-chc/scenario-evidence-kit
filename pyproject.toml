[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-evidence-kit"
version = "0.1.0"
description = "A local-first scenario workbench with reproducible validation evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ninh Quang Minh"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.12,<1"]
ai = ["openai>=2,<3"]

[project.scripts]
sek = "scenario_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenario_evidence = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
